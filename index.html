<!-- JAVASCRIPT: NOVO SISTEMA DE CÁLCULO (TAXA BASE + 100KM + KM EXCEDENTE) -->
    <script>
        // Funcionalidad de Menú Móvil
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // Cambio de Idioma Básico (ES / EN)
        let currentLang = 'es';
        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-indicator').innerText = lang.toUpperCase();
            if(lang === 'es') {
                document.getElementById('btn-es').className = "px-3 py-1.5 rounded-full font-bold transition-all bg-brand-gold text-brand-navy shadow-sm";
                document.getElementById('btn-en').className = "px-3 py-1.5 rounded-full font-bold transition-all text-slate-300 hover:text-white";
            } else {
                document.getElementById('btn-en').className = "px-3 py-1.5 rounded-full font-bold transition-all bg-brand-gold text-brand-navy shadow-sm";
                document.getElementById('btn-es').className = "px-3 py-1.5 rounded-full font-bold transition-all text-slate-300 hover:text-white";
            }
        }

        function toggleLanguage() {
            setLanguage(currentLang === 'es' ? 'en' : 'es');
        }

        /**
         * SISTEMA DE CÁLCULO ATUALIZADO:
         * - Sempre considera Ida e Volta automático (Distância x 2)
         * - Taxa base fixa: € 50.00
         * - Até 100 km totais: € 1.33 por km
         * - Acima de 100 km totais: € 1.33 nos primeiros 100 km + € 2.00 por cada km excedente
         */
        function calculateQuote(event) {
            if (event) event.preventDefault();

            const origin = document.getElementById('origin').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const cargoType = document.getElementById('cargoType').value;
            const weight = parseFloat(document.getElementById('weight').value) || 10;

            // Distância de ida estimada a partir de València (ou padrão)
            let distanciaIdaKm = 40; 

            const destLower = destination.toLowerCase();
            const origLower = origin.toLowerCase();
            
            if (destLower.includes('madrid') || origLower.includes('madrid')) {
                distanciaIdaKm = 350;
            } else if (destLower.includes('castellon') || destLower.includes('castellón')) {
                distanciaIdaKm = 75;
            } else if (destLower.includes('barcelona')) {
                distanciaIdaKm = 350;
            } else if (destLower.includes('alicante')) {
                distanciaIdaKm = 170;
            } else if (destLower.includes('valencia') || destLower.includes('valència')) {
                distanciaIdaKm = 15;
            }

            // 1. Regra de Ida e Volta Automática (Distância Total)
            const distanciaTotalKm = distanciaIdaKm * 2;

            // 2. Aplicação da Nova Tabela de Preços
            const TAXA_BASE = 50.00;
            const PRECO_ATE_100KM = 1.33;
            const PRECO_EXCEDENTE_100KM = 2.00;

            let custoKm = 0;

            if (distanciaTotalKm <= 100) {
                custoKm = distanciaTotalKm * PRECO_ATE_100KM;
            } else {
                const kmDentroDaFaixa = 100;
                const kmExcedentes = distanciaTotalKm - 100;
                custoKm = (kmDentroDaFaixa * PRECO_ATE_100KM) + (kmExcedentes * PRECO_EXCEDENTE_100KM);
            }

            let valorFinal = TAXA_BASE + custoKm;

            // Ajuste leve se for carga completa ou especial
            if (cargoType === 'large' || cargoType === 'special') {
                valorFinal *= 1.10; 
            }

            // Exibir Resultado
            const resultDiv = document.getElementById('quoteResult');
            const priceRange = document.getElementById('priceRange');
            const quoteDetails = document.getElementById('quoteDetails');

            priceRange.innerText = `€${valorFinal.toFixed(2)}`;
            quoteDetails.innerHTML = `
                <strong>Ruta (Ida y Vuelta):</strong> ${origin} ➔ ${destination} ➔ ${origin} (${distanciaTotalKm} km totales)<br>
                <strong>Desglose:</strong> Tarifa Base (€50.00) + Cálculo por Kilometraje<br>
                <span class="text-brand-gold">Nota: Peajes y tiempo de espera excedente se cobran a parte.</span>
            `;
            
            resultDiv.classList.remove('hidden');
        }

        // Enviar cotação para o WhatsApp
        function sendWhatsAppQuote() {
            const origin = document.getElementById('origin').value || 'València';
            const destination = document.getElementById('destination').value || 'No especificado';
            const cargoType = document.getElementById('cargoType').value;
            const weight = document.getElementById('weight').value || 'No especificado';

            const text = `Hola, quisiera solicitar un presupuesto de transporte (Ida y Vuelta):\n- Origen: ${origin}\n- Destino: ${destination}\n- Tipo de Carga: ${cargoType}\n- Peso Aprox: ${weight} kg`;
            const encodedText = encodeURIComponent(text);
            
            window.open(`https://wa.me/34691321485?text=${encodedText}`, '_blank');
        }
    </script>
